<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, sans-serif;
      font-size: 12px;
      color: #ccc;
      background: #2a2a2a;
      padding: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.connected  { background: #4caf50; }
    .dot.connecting { background: #ff9800; }
    .dot.error      { background: #f44336; }
    #statusText { color: #aaa; }
    #lastEvent  { font-size: 11px; color: #666; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="dot connecting" id="dot"></div>
    <span id="statusText">Connecting…</span>
  </div>
  <div id="lastEvent">—</div>
  <script src="src/main.js"></script>
</body>
</html>
